services:
  - type: web
    name: sylcla
    runtime: node
    plan: starter
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SYLCLA_PASSWORD
        sync: false
    disk:
      name: sylcla-data
      mountPath: /var/data
      sizeGB: 1
